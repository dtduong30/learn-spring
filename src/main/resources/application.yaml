spring:
  application:
    name: store
  datasource:
    url: jdbc:mariadb://localhost:3306/store_api?createDatabaseIfNotExist=true
    username: root
    password: 123456
  jpa:
    show-sql: true
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 300
    refreshTokenExpiration: 604800
  stripe:
    secretKey: ${STRIPE_SECRET_KEY}
